name: Pieces Cloud Video Renderer

# Renders one piece-engine video (engines/pieces): downloads the bundle the server prepared (plan.json, narration, the pieces drawn for this video AND the
# engine code itself, so this workflow needs nothing from the repo), renders the frames with Skia, burns the captions with libass (Hindi needs real text
# shaping) and uploads video.mp4. The server then runs its QA gate on the result.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "Bundle token", required: true }
      bundle_url: { description: "URL of the bundle tar.gz", required: true }
      captions: { description: "skia | ass", required: false, default: "ass" }

concurrency:
  group: pieces-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python packages
        run: pip install --quiet skia-python pillow numpy
      - name: ffmpeg (libass) and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
          fc-cache -f
          ffmpeg -hide_banner -filters | grep -E " ass " || { echo "this ffmpeg has no libass"; exit 1; }
      - name: Download the bundle
        run: |
          mkdir -p job
          curl -fsSL --retry 4 -A "shorts-automation-renderer" "${{ inputs.bundle_url }}" -o bundle.tar.gz
          tar -xzf bundle.tar.gz -C job
      - name: Render
        run: python3 job/engines/pieces/run_job.py job video.mp4 --no-draw --captions "${{ inputs.captions }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-pieces-${{ inputs.job_id }}
          path: video.mp4
          retention-days: 1
